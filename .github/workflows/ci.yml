# Matriz §3.7 / AER-REQ-233, ajustada pela CHANGE-0001 (sem macOS Intel).
# Estado por alvo: job support-matrix (resumo do run). Todos os alvos são TARGET (arm64 aprovado em 24/11/2026).
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]   # macos-latest = Apple Silicon (arm64)
        node: ['22.x', '24.x']
        include:
          - os: ubuntu-24.04-arm
            node: '22.x'
          - os: windows-11-arm
            node: '22.x'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: alvo (platform-arch-node)
        run: node -p "process.platform + '-' + process.arch + ' ' + process.version"
      - run: npm ci
      # TAR-0070: harness ConPTY só no CI do Windows, fora do lockfile (dependência nativa aprovada pelo responsável)
      - name: node-pty para o e2e da TUI no ConPTY
        if: runner.os == 'Windows'
        run: npm install --no-save --ignore-scripts=false node-pty@1.1.0
      - name: lint + typecheck + build + testes (unit, integração, E2E com processos reais, pty em macOS/Linux)
        run: npm run verify
        env:
          AER_REQUIRE_CONPTY: ${{ runner.os == 'Windows' && '1' || '0' }}
      - name: smoke dos bins compilados
        run: |
          node apps/ases-cli/bin/ases.js --version
          node apps/ases-tar/bin/ases-tar.js --version
          node apps/ases-cli/bin/ases.js doctor --json
      - name: pacote npm único (autocontido) instalado num prefixo temporário + shells (AER-REQ-004/232, C-OS-05)
        run: |
          node scripts/pack.mjs
          node scripts/pack-smoke.mjs
      - name: hashes das fontes ASES e das referências de marca (AER-REQ-151, AER-REQ-250)
        if: runner.os != 'Windows'
        run: |
          shasum -a 256 -c MANIFESTO_FONTES_SHA256.txt
          shasum -a 256 -c branding/MANIFESTO_IMAGENS_SHA256.txt
  # AER-REQ-233: matriz publicada no resumo do run, com PASS/FAIL/NOT_RUN por alvo (cancelado = NOT_RUN)
  support-matrix:
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: matriz de suporte a partir dos jobs reais
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/support-matrix.mjs "$GITHUB_RUN_ID"
