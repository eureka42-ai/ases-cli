<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculadora" aria-label="Calculadora">
    <output class="visor" aria-live="polite">
      <div class="expressao" id="expressao"></div>
      <div class="resultado" id="resultado">0</div>
    </output>

    <div class="teclas">
      <button class="tecla funcao" data-acao="limpar">AC</button>
      <button class="tecla funcao" data-acao="apagar" aria-label="Apagar">⌫</button>
      <button class="tecla funcao" data-acao="porcentagem">%</button>
      <button class="tecla operador" data-operador="/" aria-label="Dividir">÷</button>

      <button class="tecla" data-numero="7">7</button>
      <button class="tecla" data-numero="8">8</button>
      <button class="tecla" data-numero="9">9</button>
      <button class="tecla operador" data-operador="*" aria-label="Multiplicar">×</button>

      <button class="tecla" data-numero="4">4</button>
      <button class="tecla" data-numero="5">5</button>
      <button class="tecla" data-numero="6">6</button>
      <button class="tecla operador" data-operador="-" aria-label="Subtrair">−</button>

      <button class="tecla" data-numero="1">1</button>
      <button class="tecla" data-numero="2">2</button>
      <button class="tecla" data-numero="3">3</button>
      <button class="tecla operador" data-operador="+" aria-label="Somar">+</button>

      <button class="tecla" data-acao="sinal" aria-label="Inverter sinal">±</button>
      <button class="tecla" data-numero="0">0</button>
      <button class="tecla" data-acao="virgula">,</button>
      <button class="tecla igual" data-acao="igual">=</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
